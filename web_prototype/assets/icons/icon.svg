<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="thikanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DB9F0"/>
      <stop offset="50%" stop-color="#A8C7F4"/>
      <stop offset="100%" stop-color="#F5B69E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8DB9F0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="128" fill="#1A2138"/>

  <!-- Glowing outer rim -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#thikanaGrad)" stroke-width="8" opacity="0.6" filter="url(#glow)"/>

  <!-- Shield Shape -->
  <g transform="translate(106, 96)">
    <path d="M150 20 L270 65 C270 190, 195 260, 150 295 C105 260, 30 190, 30 65 Z"
          fill="url(#thikanaGrad)"/>
    
    <!-- Inner Dark Shield -->
    <path d="M150 38 L252 76 C252 182, 188 244, 150 274 C112 244, 48 182, 48 76 Z"
          fill="#1A2138"/>

    <!-- Verified Checkmark in Peach -->
    <path d="M100 155 L135 190 L205 110"
          fill="none" stroke="#F5B69E" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Thikana text branding -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#E9E8F8" text-anchor="middle" letter-spacing="4">THIKANA</text>
</svg>